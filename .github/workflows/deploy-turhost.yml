name: Deploy Döşemealtı categories and blog to Turhost (FTPS)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-turhost.yml"
      - "dosemealti/assets/**"
      - "dosemealti/bijuteri/**"
      - "dosemealti/kirtasiye/**"
      - "dosemealti/oyuncak/**"
      - "dosemealti/hediyelik-esya/**"
      - "dosemealti/blog/**"
      - "dosemealti/components/**"
      - "scripts/render_shared_components.py"
      - "scripts/build_dosemealti_sitemap.py"
      - "dosemealti/sitemap.xml"
      - "tests/test_blog_seo.py"
      - "tests/test_shared_components.py"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test mode: connect and list planned uploads without changing files"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: turhost-dosemealti-category-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # After successful FTPS dry-run, live push deployment is enabled by default.
    # To pause real uploads, set TURHOST_DEPLOY_ENABLED=false in Actions Variables.
    # Manual dry runs remain available even while live uploads are paused.
    if: ${{ vars.TURHOST_DEPLOY_ENABLED != 'false' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Test global Header/Footer rendering and idempotence
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Validate Turhost settings
        env:
          FTP_HOST: ${{ secrets.TURHOST_FTP_HOST }}
          FTP_USER: ${{ secrets.TURHOST_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.TURHOST_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.TURHOST_REMOTE_DIR || secrets.TURHOST_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "$FTP_HOST" ]]; then
            echo "::error title=Missing GitHub secret::TURHOST_FTP_HOST is missing or empty."
            missing=1
          fi
          if [[ -z "$FTP_USER" ]]; then
            echo "::error title=Missing GitHub secret::TURHOST_FTP_USER is missing or empty."
            missing=1
          fi
          if [[ -z "$FTP_PASSWORD" ]]; then
            echo "::error title=Missing GitHub secret::TURHOST_FTP_PASSWORD is missing or empty."
            missing=1
          fi
          if [[ -z "$FTP_REMOTE_DIR" ]]; then
            echo "::error title=Missing GitHub variable::TURHOST_REMOTE_DIR is missing or empty. Create it as a repository Variable or Secret (Settings > Secrets and variables > Actions)."
            missing=1
          fi
          if [[ "$missing" != 0 ]]; then
            exit 1
          fi
          if [[ "$FTP_REMOTE_DIR" == /home/* || "$FTP_REMOTE_DIR" == /public_html* ]]; then
            echo "::error title=Wrong FTP directory::TURHOST_REMOTE_DIR is a hosting filesystem path. Use a path relative to the FTP account's login directory: ./ if the account starts inside dosemealti, or dosemealti/ if it starts in public_html."
            exit 1
          fi
          if [[ "$FTP_REMOTE_DIR" == *..* || "$FTP_REMOTE_DIR" == *'$'* || "$FTP_REMOTE_DIR" == *';'* ]]; then
            echo "::error::Remote directory contains disallowed characters."
            exit 1
          fi
          echo "FTP settings present. The remote directory must point to the existing /dosemealti/ folder (or a restricted FTP account's root)."

      - name: Stage categories and blog without replacing the homepage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/dosemealti
          cp -R dosemealti/assets dosemealti/bijuteri dosemealti/kirtasiye dosemealti/oyuncak dosemealti/hediyelik-esya dosemealti/blog deploy/dosemealti/
          test -f deploy/dosemealti/assets/site.css
          test -f deploy/dosemealti/blog/index.html
          test ! -e deploy/dosemealti/index.html
          find deploy/dosemealti -type f | sort

      - name: Render global header/footer into the category and blog pages
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/render_shared_components.py --site-root deploy/dosemealti --min-pages 8
          python3 scripts/render_shared_components.py --site-root deploy/dosemealti --min-pages 8 --check

      - name: Version the blog stylesheet by content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib
          import re
          from pathlib import Path

          site = Path("deploy/dosemealti")
          version = hashlib.sha256((site / "assets/blog.css").read_bytes()).hexdigest()
          for page in sorted((site / "blog").rglob("index.html")):
              html = page.read_bytes()
              updated, count = re.subn(
                  rb'(href="(?:\.\./)+assets/blog\.css)(?:\?[^"]*)?"',
                  rb'\g<1>?v=' + version.encode("ascii") + b'"',
                  html,
              )
              if count != 1:
                  raise SystemExit(f"{page}: expected one blog stylesheet link, found {count}")
              page.write_bytes(updated)
          PYTHON

      - name: Build the Döşemealtı sitemap from the staged pages
        run: |
          python3 scripts/build_dosemealti_sitemap.py deploy/dosemealti

      - name: Upload via encrypted explicit FTPS (no server-side deletes)
        uses: airvzxf/ftp-deployment-action@v3.1.0
        with:
          server: ftp://${{ secrets.TURHOST_FTP_HOST }}:21
          user: ${{ secrets.TURHOST_FTP_USER }}
          password: ${{ secrets.TURHOST_FTP_PASSWORD }}
          local_dir: "./deploy/dosemealti/"
          remote_dir: ${{ vars.TURHOST_REMOTE_DIR || secrets.TURHOST_REMOTE_DIR }}
          delete: "false"
          max_retries: "2"
          ftp_ssl_allow: "true"
          ssl_verify_certificate: "true"
          ssl_check_hostname: "true"
          lftp_settings: "set ftp:ssl-force true;"
          dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}

      - name: Integrate Sternenglanz toggle into existing Döşemealtı homepage safely
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          FTP_HOST: ${{ secrets.TURHOST_FTP_HOST }}
          FTP_USER: ${{ secrets.TURHOST_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.TURHOST_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.TURHOST_REMOTE_DIR || secrets.TURHOST_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          mkdir -p homepage-patch
          case "$FTP_REMOTE_DIR" in
            *..*|*';'*|*'$'*|'') echo "Invalid remote directory"; exit 1 ;;
          esac
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp -u "$FTP_USER","$LFTP_PASSWORD" "ftp://$FTP_HOST:21" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          set net:timeout 25
          cd "$FTP_REMOTE_DIR"
          get index.html -o homepage-patch/original.html
          bye
          LFTP
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path("homepage-patch/original.html").read_bytes()
          if len(src) < 500 or b'</body' not in src.lower():
              raise SystemExit("Remote homepage missing or unexpected; refusing overwrite")
          tag = b'<script defer src="/dosemealti/assets/sternenglanz-scroll.js?v=20261121"></script>'
          if tag in src:
              Path("homepage-patch/unchanged").touch()
              print("Sternenglanz already installed")
          elif b'sternenglanz-scroll.js' in src:
              raise SystemExit("Another Sternenglanz version already exists; manual review required")
          else:
              result, n = re.subn(rb'</body\s*>', lambda m: tag + b'\n' + m.group(0), src, count=1, flags=re.I)
              if n != 1: raise SystemExit("Could not find closing body")
              Path("homepage-patch/updated.html").write_bytes(result)
              print("Prepared minimally patched homepage; original preserved")
          PY
          if [[ ! -e homepage-patch/unchanged ]]; then
            lftp -u "$FTP_USER","$LFTP_PASSWORD" "ftp://$FTP_HOST:21" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          set net:timeout 25
          cd "$FTP_REMOTE_DIR"
          put homepage-patch/original.html -o .sternenglanz-homepage-backup-20261121.html
          put homepage-patch/updated.html -o .sternenglanz-homepage-upload.tmp
          mv .sternenglanz-homepage-upload.tmp index.html
          bye
          LFTP
          fi
          python3 - <<'PY'
          import urllib.request
          url = "https://harikaseylerdukkani.com/dosemealti/"
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "Harika-Deploy-Verify"})
                  data = urllib.request.urlopen(req, timeout=20).read()
                  if b'sternenglanz-scroll.js' in data:
                      print("Verified live homepage includes Sternenglanz script")
                      break
              except Exception as exc:
                  print("Verification attempt:", exc)
              if attempt == 2: raise SystemExit("Live homepage verification failed")
              import time; time.sleep(5)
          PY

      - name: Verify the public categories, blog and sitemap
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/dosemealti
          version=$(sha256sum assets/blog.css | cut -d ' ' -f 1)
          downloaded=$(mktemp)
          trap 'rm -f "$downloaded"' EXIT
          verify() {
            local file="$1" url="$2"
            for attempt in 1 2 3; do
              if curl --fail --silent --show-error --compressed --max-time 20 \
                  "https://harikaseylerdukkani.com/dosemealti/$url" -o "$downloaded" &&
                  cmp -s "$file" "$downloaded"; then
                echo "Verified $url"
                return 0
              fi
              if [[ "$attempt" != 3 ]]; then sleep 5; fi
            done
            echo "::error::Public response does not match staged file: $url"
            return 1
          }
          verify sitemap.xml sitemap.xml
          verify assets/blog.css "assets/blog.css?v=$version"
          while IFS= read -r -d '' page; do
            verify "$page" "${page%index.html}"
          done < <(find bijuteri kirtasiye oyuncak hediyelik-esya blog -name index.html -print0)

